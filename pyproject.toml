[build-system]
# 77, not 68: `license` as an SPDX string and `license-files` are PEP 639, which
# setuptools only understands from 77.  Build isolation hides this by fetching
# the newest setuptools anyway, so it only bites on --no-build-isolation, where
# it surfaces as an AssertionError from setuptools reading this file.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "candejar"
version = "0.1.0.dev0"
description = "A CANDE preprocessor core: read, validate and write CANDE .cid input files"
authors = [{ name = "Rick Teachey", email = "ricky@teachey.org" }]
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = ["cande", "culvert", "buried structure", "finite element", "cid"]
classifiers = [
    # Refuses an accidental `twine upload`; this package is not for PyPI.
    "Private :: Do Not Upload",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/Ricyteach/cande-editor"

[project.scripts]
candejar = "candejar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
candejar = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
# Markdown is excluded because ruff formats Python code blocks inside it, and
# the code in docs/ is illustrative rather than runnable: REDESIGN-PROPOSAL.md
# aligns its column tables by hand to show what a fixed-column record looks
# like, which the formatter collapses.  That alignment is the content, not
# styling, in a document about fixed-column layouts.  This is what made
# `ruff format --check .` fail in CI.
extend-exclude = ["legacy", "docs/notes", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
# Strict on the library. The tests are fully annotated too, but pytest's fixture
# and parametrize decorators do not survive --strict, so they are covered by ruff
# and by actually running them rather than by mypy.
files = ["src"]
python_version = "3.11"
strict = true
exclude = "^(legacy|docs)/"
